<!doctype html>
<html lang="vi"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Làng thử Godot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* The game fills the screen; one small status card in the middle while it loads. Single dark look (a game screen). */
:root{--ink:#0b110f;--txt:#e6efe8;--dim:#9fb3a6;--on:#d9b25a;--line:rgba(190,214,198,.18);--ui:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--ink);color:var(--txt);font-family:var(--ui);overflow:hidden;overscroll-behavior:none}
#canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#st[hidden]{display:none}
#st{position:fixed;inset:0;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
#st div{display:grid;gap:10px;justify-items:center;font-size:15px;color:var(--dim);text-align:center}
#bar{width:220px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--on)}
</style>
</head><body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="st"><div><span id="msg">Đang tải game…</span><span id="bar"><i id="fill"></i></span></div></div>
<script src="index.js?v=ffb22084"></script>
<script>
(function(){
var CFG={"args": [], "canvasResizePolicy": 2, "emscriptenPoolSize": 8, "ensureCrossOriginIsolationHeaders": false, "executable": "index", "experimentalVK": false, "fileSizes": {"index.pck": 14212968, "index.wasm": 38034280}, "focusCanvas": true, "gdextensionLibs": [], "godotPoolSize": 4},NP=1,WASM=38034280,PCK=14212968,B='fbdc42de',EV='dfd3ae5f';
var msg=document.getElementById('msg'),fill=document.getElementById('fill'),st=document.getElementById('st');
// The engine asks for index.wasm and index.pck. They are published as engine.wasm (gzip) and pck_<n>.wasm (slices),
// so those two requests are answered here from the published pieces. Every file of a build carries ?v=<crc> so a
// phone never runs an old copy kept by its browser.
var F0=window.fetch.bind(window);
function joined(urls,type){var i=0,rd=null;return new Response(new ReadableStream({pull:function(c){
  function next(){if(rd)return rd.read().then(function(r){if(r.done){rd=null;return next()}c.enqueue(r.value)});
    if(i>=urls.length){c.close();return}
    return F0(urls[i++]).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);rd=r.body.getReader();return next()})}
  return next()}}),{status:200,headers:{'Content-Type':type}})}
// Village pieces (d/<name>.wasm?v=<crc>) are installed once into the browser's own store (Cache Storage) and read
// from there afterwards; a background job installs the whole village after the engine starts, coarse levels first,
// then the sharp ones nearest the start view. A new build changes ?v= only for the bundles that changed.
var CSN='nt-godot-lang',CS=null;
var csP=(window.caches&&caches.open?caches.open(CSN).then(function(c){CS=c;return c},function(){return null}):Promise.resolve(null));
function stored(s){return csP.then(function(c){if(!c)return F0(s);var abs=new URL(s,location.href).href;
  return c.match(abs).then(function(hit){if(hit)return hit;return F0(s).then(function(r){if(r.ok)c.put(abs,r.clone()).catch(function(){});return r})})},function(){return F0(s)})}
window.__gdpre='';
function install(){F0('info.json?v='+B).then(function(r){return r.json()}).then(function(I){var bh=I.bh||{},X0=I.X0,Y0=I.Y0,sx=I.start[0],sy=I.start[1];
  var L=Object.keys(bh).map(function(n){var m=/^([go])(\d)(?:_(\d+)_(\d+))?$/.exec(n),l=m?+m[2]:9,d=0;
    if(m&&m[3]!=null){var u=m[1]=='g'?512*Math.pow(2,l):2048;d=Math.hypot(X0+(+m[3]+.5)*u-sx,Y0+(+m[4]+.5)*u-sy)}
    return {u:'d/'+n+'.wasm?v='+bh[n],k:-l*1e7+d}}).sort(function(a,b){return a.k-b.k});
  var keep={};L.forEach(function(e){keep[new URL(e.u,location.href).href]=1});
  csP.then(function(c){if(!c)return;return c.keys().then(function(ks){var have={};ks.forEach(function(q){have[q.url]=1;if(/\/d\//.test(q.url)&&!keep[q.url])c.delete(q)});
    L=L.filter(function(e){return !have[new URL(e.u,location.href).href]});var i=0,done=0,run=0;
    function show(){window.__gdpre=done<L.length?'lưu làng vào máy '+done+'/'+L.length+' gói (một lần)':''}
    function next(){while(run<2&&i<L.length){(function(e){run++;var abs=new URL(e.u,location.href).href;
      F0(e.u).then(function(r){if(r.ok)return c.put(abs,r)}).catch(function(){}).then(function(){run--;done++;show();next()})})(L[i++])}}
    show();next()})})}).catch(function(){})}
window.fetch=function(u,o){var s=typeof u=='string'?u:(u&&u.url)||'';
  if(/(^|\/)d\/[^\/?]+\.wasm\?v=/.test(s))return stored(s);
  if(/index\.wasm(\?|$)/.test(s))return F0('engine.wasm?v='+EV).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);
    return new Response(r.body.pipeThrough(new DecompressionStream('gzip')),{status:200,headers:{'Content-Type':'application/wasm'}})});
  if(/index\.pck(\?|$)/.test(s)){var a=[];for(var k=0;k<NP;k++)a.push('pck_'+k+'.wasm?v='+B);return Promise.resolve(joined(a,'application/octet-stream'))}
  if(/(^|\/)(info\.json|w\/[^\/?]+|n\/sc\.json)$/.test(s))return F0(s+'?v='+B,o);
  return F0(u,o)};
if(typeof DecompressionStream=='undefined'){msg.textContent='Trình duyệt này cũ quá, không giải nén được game.';return}
var engine=new Engine(CFG);
engine.startGame({onProgress:function(cur,tot){var t=tot>0?tot:WASM+PCK;fill.style.width=Math.min(100,cur/t*100)+'%'}}).then(function(){st.hidden=true;
  // the whole village is stored only after the first view is sharp (Godot sets __gdready), so it does not slow that view
  (function w(){if(window.__gdready)install();else setTimeout(w,500)})()},function(e){msg.textContent='Lỗi: '+(e&&e.message||e)});
})();
</script>
</body></html>
