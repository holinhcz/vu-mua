<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cờ Caro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9c8566;font-family:system-ui,sans-serif}
#canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#st{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#3a2412;background:#c9b48f}
#bar{width:min(320px,70vw);height:10px;border-radius:6px;background:#fff6e2;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
#fill{height:100%;width:0;background:#6a9a3a}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="st"><b style="font-size:22px">Cờ Caro</b><div id="bar"><div id="fill"></div></div><div id="msg">Đang tải…</div></div>
<script src="../index.js?v=d2d34ecb"></script>
<script>
(function(){
// Bản chơi riêng của Cờ caro. Dùng chung engine của Nông Trại (../engine.wasm, nén gzip), gói game riêng caro.pck.
var CFG={"args":[],"canvasResizePolicy":2,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":19410136,"index.wasm":38034280},"focusCanvas":true,"gdextensionLibs":[],"ensureCrossOriginIsolationHeaders":false},PCK=19410136,B='6d9941c9',EV='d2d34ecb';
var msg=document.getElementById('msg'),fill=document.getElementById('fill'),st=document.getElementById('st');
var F0=window.fetch.bind(window);
window.fetch=function(u,o){var s=typeof u=='string'?u:(u&&u.url)||'';
  if(/index\.wasm(\?|$)/.test(s))return F0('../engine.wasm?v='+EV).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);
    return new Response(r.body.pipeThrough(new DecompressionStream('gzip')),{status:200,headers:{'Content-Type':'application/wasm'}})});
  if(/index\.pck(\?|$)/.test(s))return F0('caro.pck?v='+B);
  var m=/index\.(audio[a-z.]*\.js)/.exec(s);if(m)return F0('../index.'+m[1]);
  return F0(u,o)};
if(typeof DecompressionStream=='undefined'){msg.textContent='Trình duyệt này cũ quá.';return}
// trang cũ trong bộ nhớ đệm trình duyệt (GitHub giữ 10 phút) -> hỏi bản mới nhất, khác thì tải lại trang
F0('ver.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():B},function(){return B}).then(function(v){v=(v||'').trim()||B;
if(v!=B&&location.search.indexOf('r='+v)<0){location.replace(location.pathname+'?r='+v);return}
var T0=Date.now();new Engine(CFG).startGame({onProgress:function(c,t){var T=t>0?t:38034280+PCK;fill.style.width=Math.min(100,c/T*100)+'%';var s=(Date.now()-T0)/1000;msg.textContent=c>=T?'Đang mở game...':'Đang tải '+(c/1048576).toFixed(1)+' / '+(T/1048576).toFixed(0)+' MB · '+(s>0.5?(c/1048576/s).toFixed(1):'…')+' MB/giây'}})
  .then(function(){st.style.display='none'},function(e){msg.textContent='Lỗi: '+(e&&e.message||e)});
})})();
</script>
</body></html>
